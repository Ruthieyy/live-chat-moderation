[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-chat-moderation"
version = "1.0.0"
description = "Real-time livestream comment moderation with ONNX Runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
train = ["torch>=2.5", "scikit-learn>=1.5", "onnx>=1.16"]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "locust>=2.32",
    "fakeredis>=2.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 112
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
